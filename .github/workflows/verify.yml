name: Verify benchmark
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned external data for code-only checkouts
        if: ${{ hashFiles('redcommerce/data/FILES.json') == '' }}
        env:
          REDCOMMERCE_DATA_URL: ${{ vars.REDCOMMERCE_DATA_URL }}
          REDCOMMERCE_DATA_SHA256: ${{ vars.REDCOMMERCE_DATA_SHA256 }}
        run: python -B scripts/install_ci_data.py
      - name: Verify frozen source bytes
        run: python -B scripts/check_release.py
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m redcommerce reproduce
      - run: python -B -m redcommerce replay
