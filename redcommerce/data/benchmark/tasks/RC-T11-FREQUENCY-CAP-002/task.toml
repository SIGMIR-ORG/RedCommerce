lifecycle = [1, 1, 1, 2]
source_class = "Merchant"
target_domain = "Platform"
primary_binding = "B-EVID"
secondary_bindings = ["B-AUTH", "B-MAND", "B-STATE"]
mechanisms = ["M3"]
[case]
