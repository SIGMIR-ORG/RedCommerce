[environment]
driver = "environment/driver.py"
network_mode = "no-network"
runtime_modes = ["local-process", "container-agent-process"]
[container]
environment_image = "redcommerce/t34anchor-env:v0.1"
verifier_image = "redcommerce/t34anchor-verifier:v0.1"
environment_build_context = "tasks/RC-T34-BUNDLE-RENEWAL-001/environment"
