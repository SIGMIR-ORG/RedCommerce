schema_version = "0.1"
[task]
name = "redcommerce/RC-T34-BUNDLE-RENEWAL-001"
version = "0.1.0"
description = "Synthetic T3.4 business binding anchor"
[taxonomy]
threat_id = "T3.4"
lifecycle = [3, 3, 3, 3]
source_class = "Merchant"
target_domain = "Consumer"
primary_binding = "B-MAND"
secondary_bindings = ["B-EVID", "B-AUTH", "B-TERM", "B-STATE"]
mechanisms = ["M5"]
[case]
case_id = "RC-T34-BUNDLE-RENEWAL-001"
benign_variant = "RC-T34-BUNDLE-RENEWAL-001-V00"
